name: Hírek frissítése és közzététele

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: horizont-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hírek begyűjtése
        run: python scripts/fetch_news.py

      - name: Hírlista mentése a repositoryba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Hírek automatikus frissítése"
            git push origin HEAD:main
          fi

      - name: GitHub Pages beállítása
        uses: actions/configure-pages@v5

      - name: Közzéteendő statikus oldal összeállítása
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js _site/
          cp data/news.json _site/data/news.json
          touch _site/.nojekyll

      - name: Pages-csomag feltöltése
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Közzététel GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
